name: Restore game module

on:
  push:
    branches:
      - refactor/handlers-split

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[restore-game]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore historical game.py
        run: |
          git checkout b8a2a92684eeab3296a29d9b5518e3e07384f254 -- mafia_bot/game.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mafia_bot/game.py
          git diff --cached --quiet && exit 0
          git commit -m "Restore mafia_bot/game.py [restore-game]"
          git push origin HEAD:refactor/handlers-split
