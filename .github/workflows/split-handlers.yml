name: Split handlers

on:
  push:
    branches:
      - refactor/handlers-split

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/split_handlers.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A mafia_bot tools
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refactor handlers into modules"
          git push origin HEAD:refactor/handlers-split
